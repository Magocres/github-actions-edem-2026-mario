name: "Ejercicio Entregable GitHub Actions"

on:
  workflow_dispatch:
    inputs:
      test_seguridad:
        description: "¿Desea ejecutar los Tests de Seguridad?"
        required: true
        type: choice
        options:
          - "sí"
          - "no"
        default: "sí"

jobs:
  ci_security:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Validación del JSON
        run: python -c "import json; json.load(open('ventas.json'))"

      - name: Simulador Escaneo de Seguridad
        if: ${{ inputs.test_seguridad == 'sí' }}
        run: echo "Se ha completado con éxito el Escaneo de Seguridad"
