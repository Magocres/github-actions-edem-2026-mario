name: "Ejercicio Entregable GitHub Actions"
on:
  workflow-dispatch:
    inputs:
      test_seguridad:
        description: "¿Desea ejecutar los Tests de Seguridad?"
        required: true
        type: choice
        options:
          - sí
          - no
jobs:
  ci_&_security:
    runs-on: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      - name: Validación del JSON
        run: python3 -c "import json; json.load(open('ventas.json'))"
      
      - name: Simulador Escaneo de Seguridad
        if: github.event.inputs.test_seguridad == 'sí'
        run echo "Se ha completado con éxito el Escaneo de Seguridad"