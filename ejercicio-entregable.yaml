name: "Ejercicio Entregable GitHub Actions"

on:
  workflow_dispatch:
    inputs:
      test_seguridad:
        description: "¿Desea ejecutar los Tests de Seguridad?"
        required: true
        type: choice
        options:
          - "sí"
          - "no"
        default: "sí"

jobs:
  ci_security:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validación del JSON
        run: |
          # Verificamos que el archivo existe antes de validarlo
          python3 -c "import json; json.load(open('ventas.json'))"

      - name: Simulador Escaneo de Seguridad
        if: ${{ inputs.test_seguridad == 'sí' }}
        run: echo "Se ha completado con éxito el Escaneo de Seguridad"