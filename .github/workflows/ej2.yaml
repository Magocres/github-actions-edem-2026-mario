name: Ejercicio 2

on:
  workflow_dispatch:

jobs:
  simular-login:
    runs-on: ubuntu-latest
    
    steps:

      - name: Simular inicio de sesión
        run: |
          echo "Iniciando sesión con el usuario: $USUARIO"
          echo "La contraseña utilizada es: $PASSWORD"
        env:
          PASSWORD: echo "${{ secrets.PASSWORD }}"
      - name: Mostrar mensaje de éxito
        run: echo "¡Inicio de sesión simulado con éxito!"